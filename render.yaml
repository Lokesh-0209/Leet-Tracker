services:
  - type: web
    name: leet-tracker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: leet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: /var/data/leet-tracker.db
      - key: APP_PASSWORD
        sync: false
      - key: APP_USERNAME
        value: leet
