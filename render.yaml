services:
  - type: web
    name: leet-tracker
    runtime: node
    plan: starter
    branch: development
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: leet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.2"
      - key: DATABASE_PATH
        value: /var/data/leet-tracker.db
      - key: VERIFICATION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
